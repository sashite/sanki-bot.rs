# sanki-bot — the configuration (ADR-0045 §4). One file, no secret: the key
# lives in `identity.file`. Every key has a default — the BUILT-IN BOT, the
# one `sanki-bot` runs without a file, which is what this file describes:
# every uncommented value is the default; a commented line is an example
# of a key or a section that has none (or names its default). A file
# overrides the built-in bot key by key; an unknown key is refused.
# `sanki-bot --defaults` prints this file.
schema = 1

[connection]
relay           = "wss://relay.sanki.app"      # the only relay, and every session's timing relay
rules           = "000006e9da2118b7fdcdb87e13f0e30b1120676957b0b5ca9932e7b4756f9322"  # the kind-3417 Rule System event id Sashité's app founds under at this release
# data_dir      = "/var/lib/sanki-bot/data"    # absolute: rules cache, lease file; default: `<data root>/data`
rate_per_minute = 30                           # the relay's per-key limit (NIP-11 does not advertise it): the free tier
# The data root: ~/Library/Application Support/sanki-bot on macOS,
# $XDG_DATA_HOME/sanki-bot (else ~/.local/share/sanki-bot) elsewhere. The
# bot creates the directories it writes to.

[identity]
# file = "/var/lib/sanki-bot/key.nsec"         # absolute; created at the first start (0600); default: `<data root>/identity/key.nsec`

[profile]                                      # kind 0; `bot: true` is always written
name    = "sanki-bot"                          # the handle; 1 to 64 characters
about   = "A Sanki bot (sashite-sanki-bot)."
# display_name = "Kitsune"                     # optional
# picture = "https://example.com/kitsune.png"  # optional; https
# nip05   = "kitsune@sanki.app"                # optional
# website = "https://chess.page/"              # optional; https

# [engine]                                     # absent: the bot plays its fallback — at random; `--engine` on the command line replaces this whole table
# command = "sanki-sei-random-engine"          # a path, or a name resolved in PATH
# args    = []
# cwd     = "/var/lib/sanki-engine"            # absolute; the engine may write there; outside data_dir and the key's directory; default: `<data root>/engine`
# env     = {}                                 # the only variables the engine receives
# options = {}                                 # SEI options, sent by `configure`; each must be announced (the random engine: `seed`)
# strength = 1500                              # only with the `strength` feature
# max_relaunches_per_game = 2
# launch_ms = 5000                             # hello and configure acknowledged within this

[challenges]                                   # kind 30420, published and enforced
policy = "everyone"                            # everyone | following | rating | nobody
# follows          = ["<hex pubkey>", …]       # following only; non-empty
# max_delta        = 200                       # rating only; 1..=1000
# rating_authority = "<hex pubkey>"            # rating only
blocks = []                                    # kind 10000; applied before the policy

  # [challenges.outgoing]                      # absent: the bot never challenges
  # targets       = ["<hex pubkey>", …]        # non-empty, distinct, none in `blocks`
  # time_control  = [[180, 2]]                 # the periods, as kind 3420 writes them
  # variant       = "chess"                    # fixed for both players (the mirror form); in `variants` and in `opponents`
  # every_secs    = 600                        # between two challenges to the same target
  # accept_secs   = 120                        # accept_until = created_at + accept_secs
  # max_per_day   = 24                         # over all targets

[play]
variants      = ["chess", "ogi", "xiongqi"]    # what the bot plays
preferred     = "chess"                        # played when the challenger leaves the bot's variant open
opponents     = ["chess", "ogi", "xiongqi"]    # what it accepts across the board
min_move_secs = 5                              # the least time per move a game must offer, and the bot's own pace
margin_ms     = 300                            # between the hard stop and the flag instant; part of SEI's `overhead`

  [play.max_concurrent]                        # per cadence family; given, this table says what is played (a family left out: 0). Capacity: Σ caps × ⌈60 / (min_move_secs − margin_ms / 1000)⌉ (+ 1 with [challenges.outgoing]) ≤ rate_per_minute less a tenth
  byoyomi        = 1
  blitz          = 1
  rapid          = 0
  correspondence = 0

  # [play.resign]                              # absent: never resigns (each of the three needs an [engine])
  # max_win  = 20                              # ‰ (wdl)
  # min_loss = 900                             # ‰ (wdl)
  # streak   = 3                               # consecutive own turns
  # [play.offer_draw]                          # absent: never offers
  # min_draw   = 800                           # ‰
  # streak     = 3
  # after_ply  = 40
  # [play.accept_draw]                         # absent: never accepts
  # min_draw = 600                             # ‰
