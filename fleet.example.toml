# Sashité player fleet — EXAMPLE configuration (safe to commit; the real file
# is not). Copy it OUTSIDE every git repository, fill it in, and point the
# service at it:
#
#   cp fleet.example.toml ~/sanki-e2e/fleet.local.toml
#   $EDITOR ~/sanki-e2e/fleet.local.toml
#   set -a; source ~/sanki-e2e/bots.local.env; set +a
#   FLEET_CONFIG_PATH=~/sanki-e2e/fleet.local.toml cargo run --bin players
#
# Keys are referenced by ENVIRONMENT VARIABLE NAME (`nsec_env`) — the file
# itself never holds a secret. Generate production keys with `nak key generate`
# and store them in the shared bots.local.env.

[fleet]
relay_url  = "ws://localhost:8080"
matchmaker = "<matchmaker hex pubkey>"
# The Rule System event (kind 3417) the fleet plays under — its event id, the
# value `publish-rules.py` (web-specs.md) prints last, the same id the app
# (PUBLIC_RULES), the matchmaker and the rater are configured with. The event
# and the module it names are loaded at start-up (from the relay and the
# event's `url` hints) and cached below; a fleet that cannot load them does
# not start.
rules      = "<rule system event id, 64 hex characters>"
# Where the event (`<id>.json`) and the module (`<digest>.wasm`) are cached.
# A module dropped here by hand is used without fetching, after the same
# digest check. Default: ./rules
# rules_cache_dir = "/var/lib/sashite/rules"
game       = "sanki"
max_concurrent_bot_vs_bot = 3
# The relay's NIP-13 minimum on player kinds (10 in production; 0 for a dev
# relay that does not enforce PoW).
pow_difficulty = 0
# The admission service (ADR-0008), asked — fail-closed, bounded — whether the
# challenger of an ASYMMETRIC variant imposition is premium (Premium §1.3,
# ADR-0040 §2). Absent, every such imposition is refused without a request:
# right for a deployment with no admission service (this dev file). A
# production fleet sets it from day one — nobody is premium while the service
# is down, and subscribers are honoured the day it runs, with no change here.
# admission_url = "https://admission.sanki.app"
# Public relays the persona's PROFILE is also published on — the kind-0 and a
# NIP-65 relay list (kind 10002), at every start (ADR-0042): a Nostr client
# anywhere then shows her name and picture. Nothing else goes there. Empty or
# absent: the game relay only.
# profile_relays = ["wss://purplepag.es", "wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://relay.nostr.band"]

[[bot]]
name     = "kaoru"
nsec_env = "PLAYER_NSEC_KAORU"

  [bot.profile]
  display_name = "Kaoru"
  about        = "Ōgi enthusiast. Osaka evenings. (bot)"
  # picture    = "https://…"

  [bot.play]
  variants        = { ogi = 0.8, chess = 0.15, xiongqi = 0.05 }
  time_controls   = [
    { spec = [["0", "10", "1"]], weight = 0.7 },   # 10 s / move
    { spec = [["300", "3"]],     weight = 0.3 },   # 5 + 3 Fischer
  ]
  # Accept a Direct Challenge at ANY cadence, not only those above (default
  # false). `time_controls` still governs which cadences the bot OFFERS in the
  # matchmaking pool; this only relaxes what it ACCEPTS on the direct path.
  # accept_any_time_control = true
  # POOL ONLY: court an Open Challenge whose signer imposes a variant on the
  # opponent ASYMMETRICALLY (they play one variant and assign the bot a
  # DIFFERENT one — the premium form the matchmaker gates). Default false
  # keeps the bot to mirror games in the pool. The direct path is not governed
  # by this: there the bot accepts whenever it can play its own variant, the
  # challenger's being theirs, and an asymmetric imposition is honoured iff the
  # challenger is premium (fleet.admission_url) — ADR-0040 §2.
  # accept_imposed_variant = true
  strength            = { time_ms = 2000, depth = 6 }
  resign_threshold    = -700
  draw_offer          = "balanced"   # never | balanced | eager
  challenge_policy    = "everyone"
  # Seconds the bot waits, once it predicts the opponent's flag, before
  # publishing the Conclusion claiming the win on time (default 5): a human
  # whose clock just fell is not flagged to the second.
  # timeout_courtesy_secs = 5

    # Concurrent games PER CADENCE FAMILY (ADR-0039 §6; the families and the
    # classifier: web-specs.md nostr/support/cadence-sanki.md). These are the
    # defaults — an omitted family takes them; 0 disables a family. The old
    # `max_live` / `max_correspondence` keys are rejected at start-up.
    [bot.play.max_concurrent]
    byoyomi        = 1
    blitz          = 1
    rapid          = 1
    correspondence = 4

  [bot.schedule]
  timezone = "Asia/Tokyo"
  # `to` may be "24:00" — the end of the local day (the end is exclusive, so a
  # persona present around the clock writes from = "00:00", to = "24:00").
  windows  = [{ days = "mon-sun", from = "20:30", to = "23:30" }]
  jitter_minutes = 25
  presence_probability = 0.85

  [bot.tempo]
  think = { median_s = 3.0, sigma = 0.6 }
  correspondence_think = { median_s = 14400, sigma = 0.9 }

[[bot]]
name     = "lucie"
nsec_env = "PLAYER_NSEC_LUCIE"

  [bot.profile]
  display_name = "Lucie"
  about        = "Blitz chess, Paris nights. (bot)"

  [bot.play]
  variants        = { chess = 0.9, xiongqi = 0.1 }
  time_controls   = [
    { spec = [["300", "3"]], weight = 1.0 },
  ]
  strength            = { time_ms = 1200, depth = 5 }
  resign_threshold    = -600
  draw_offer          = "eager"

  [bot.schedule]
  timezone = "Europe/Paris"
  windows  = [{ days = "mon-sun", from = "21:00", to = "23:59" }]
  jitter_minutes = 15
  presence_probability = 0.9

  [bot.tempo]
  think = { median_s = 2.0, sigma = 0.5 }
  correspondence_think = { median_s = 7200, sigma = 0.8 }
