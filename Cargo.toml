[package]
name = "sashite-sanki-bot"
version = "0.2.1"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/sashite/sanki-bot.rs"
homepage = "https://sashite.com/"
readme = "README.md"
keywords = ["sashite", "sanki", "nostr", "bot", "sei"]
categories = ["games", "command-line-utilities"]
exclude = ["/.github", "/deny.toml", "/Dockerfile"]
description = "A Sanki bot for Sashité (ADR-0045): one identity, one TOML configuration, one SEI engine as a child process per game — or random play without one. Over the Nostr protocol client `sashite-sanki-client`: it answers and sends Direct Challenges under a Challenge Policy, founds, plays and concludes self-timed sessions with the verdict the rule system yields, offers, accepts and resigns on the engine's scores."

# One bot in one process: `sanki-bot [--config FILE] [--engine ARGV]` (ADR-0045 §7).
[[bin]]
name = "sanki-bot"
path = "src/bin/sanki-bot.rs"

[lib]
name = "sashite_sanki_bot"
path = "src/lib.rs"

[dependencies]
# Networking client; bundles `nostr` 0.45 (Event, EventBuilder, Tag, Kind, Keys, …).
# 0.45 is where the relay pool lives: the standalone `nostr-relay-pool` crate it
# used to pull is unmaintained (RUSTSEC-2026-0243).
nostr-sdk = "0.45"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The relay's NIP-11 document and the rule system's module bytes, over HTTPS
# (rustls, like the relay connection).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The relay's notification stream (the runtime's loop); in the tree already.
futures-util = "0.3"

# The protocol client (ADR-0045 §1): the rule system and its module, the
# session views, the notation, the relay's information, the readers, the
# drafts, the Publisher, the proven query.
sashite-sanki-client = "0.1.2"
# The SEI host (ADR-0045 §3): killing the engine's process group, through a
# safe wrapper (the crate forbids `unsafe`).
nix = { version = "0.30", features = ["signal"] }
# The fallback move (ADR-0045 §3): `HMAC-SHA256(k_fallback, session ‖ step)`;
# the identity's derived secrets (§2) by HKDF, zeroed on drop.
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
# The SEI host's tests judge the engine's moves with the native rules (the
# bot judges them with the module); `tests/sei_host.rs`.
sashite-sanki-engine = "0.12"
# The in-process relay, the reference module's native face and the signed
# suite events the bot's tests drive the client with.
sashite-sanki-client = { version = "0.1.2", features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
