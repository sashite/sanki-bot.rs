[package]
name = "sashite-sanki-player-nostr-bot"
version = "0.12.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/sashite/sanki-player-nostr-bot.rs"
description = "Sashité player-bot fleet: autonomous Nostr players for Sanki (ADR-0014, ADR-0034). One supervisor, N personas — pool courtship (kind 3418), founding and acceptance by Game Session (3422), full session play (3423) with clock discipline, Conclusions (3425) the rule system yields, rematch challenges (3420) — over the session's rule system: the module named by a Rule System event (3417), run under wasmi, is the only rules oracle; sashite-sanki-player chooses the moves."
# Internal service, not a library for crates.io.
publish = false

# Short binary name (`cargo run` / `players`) while the package keeps the
# descriptive name.
[[bin]]
name = "players"
path = "src/main.rs"

[dependencies]
# Networking client; bundles `nostr` 0.45 (Event, EventBuilder, Tag, Kind, Keys, …).
# 0.45 is where the relay pool lives: the standalone `nostr-relay-pool` crate it
# used to pull is unmaintained (RUSTSEC-2026-0243).
nostr-sdk = "0.45"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Daily log files with retention when `PLAYERS_LOG_DIR` is set (ADR-0040 §6:
# launchd redirects stdout to a file nothing rotates; the bot rotates its own).
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Timezone-aware presence windows (personas live in their own timezones).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

# The rule system (ADR-0034): the kind-3417 Rule System parser and the kind-3418
# Open Challenge parser (`nostchmaker`); the WebAssembly interpreter the session's
# module runs under (pure Rust, deterministic, no JIT — the runtime the module's
# own conformance run uses); the module's digest check; fetching the module's
# bytes from the event's `url` hints (rustls, like the relay connection).
nostchmaker = "0.9"
wasmi = { version = "2", features = ["deterministic"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Move choice (ADR-0015): the anytime search over the native engine. It is the
# bot's brain, never its rules: the tip position it searches from, the legality
# of the move it picks, the state of the session and every verdict come from the
# session's module (ADR-0034), and the search's choice is checked against the
# module's `legal_moves` before it is played.
sashite-sanki-player = "0.5"

[dev-dependencies]
# The e2e bench (tests/e2e/): an in-process NIP-01 mini relay the real binary
# connects to, with the one fault injection the §6.5 incident needs. Versions
# already in the dependency tree (via nostr-sdk), so nothing new compiles.
tokio-tungstenite = "0.26"
futures-util = "0.3"
# The reference module's library face: the same answers as the module, natively,
# so the module-driven paths are tested without building or shipping a `.wasm`.
sashite-sanki-kernel-wasm = "0.1"
# Hand-written modules of the wrong shape, for the runtime's refusal tests.
wat = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
